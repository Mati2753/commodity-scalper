[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commodity-micro-scalper"
version = "0.1.0"
description = "Capital.com demo market discovery and tick capture infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1", "websockets>=13,<16", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "pyarrow>=17,<20", "typer>=0.12,<1",
  "rich>=13.7,<14",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]
[project.scripts]
commodity-scalper = "commodity_scalper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_scalper"]
[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
